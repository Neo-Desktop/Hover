<div id="gameContainer">
    <div id="gameMessageBackground"></div>
    <div id="cloakOverlay"></div>
    
    <div id="hud"></div>
    <div id="fps"></div>
    
    <div id="hudButtons">
        <div id="zoomInButton">+</div>
        <div id="zoomOutButton">-</div>
    </div>
    
    <div id="gameButtons">
        <div id="jumpButton">Jump</div>
        <div id="wallButton">Wall</div>
        <div id="cloakButton">Cloak</div>
    </div>
    <div id="dpad">
        <div id="dpadStick"></div>
        <div id="dpadInput"></div>
    </div>

    <div id="gameMessage"></div>
    
</div>

<div id="gameLoading" class="contentArea">
    <h3 id="gameLoadingText">Loading Level <%= data.level %>...</h3>
    <div id="gameLoadingProgress"></div>
    <div id="gameLoadingGraphic"></div>
</div>
